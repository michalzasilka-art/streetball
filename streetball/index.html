<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3d3f8f">
<title>Streetball · Foxino Olympics · Fugio</title>
<meta name="description" content="Streetball: Foxino plays 1-on-1 basketball against Blaze. Answer English questions to beat your defender, score, stop his drive and block his shot. First to 3 baskets wins.">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:ital,wght@0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../olympics/common/ui.css?v=1">
<link rel="stylesheet" href="streetball.css?v=1">
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="slowmo"></div>

<div id="score" class="hidden" aria-live="polite">
  <div class="sc-side me"><span class="sc-name">FOXINO</span><span class="sc-dots" id="dotsMe"></span></div>
  <div class="sc-mid"><b id="scMe">0</b><i>:</i><b id="scHim">0</b></div>
  <div class="sc-side him"><span class="sc-dots" id="dotsHim"></span><span class="sc-name">BLAZE</span></div>
  <div class="sc-tag" id="scTag">YOUR BALL</div>
</div>

<div id="banner" aria-live="polite"></div>

<button id="leaveBtn" class="topbtn" type="button" aria-label="Leave the game">
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span>LEAVE</span>
</button>
<button id="profileBtn" class="topbtn" type="button"></button>
<button id="muteBtn" class="topbtn" type="button" aria-label="Sound on or off">
  <svg class="ico-on" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5c1.2 1 1.8 2.2 1.8 3.5s-.6 2.5-1.8 3.5M18.6 6c2 1.6 3 3.6 3 6s-1 4.4-3 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  <svg class="ico-off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
</button>

<section id="start" class="screen hidden" aria-label="Start">
  <div class="title-wrap">
    <h1 class="title"><span class="t1">1 ON 1</span><span class="t2">STREETBALL</span></h1>
    <p class="subtitle">Answer right to beat Blaze. First to 3 baskets wins!</p>
  </div>
  <div class="panel start-panel">
    <div id="record" class="record"></div>
    <div class="opt-row"><span>English level</span><div class="seg" id="levelSeg"><button type="button" data-lv="1">A1</button><button type="button" data-lv="2">A2</button></div></div>
    <button id="packBtn" class="packcard" type="button"></button>
    <button id="playBtn" class="bigbtn" type="button">PLAY</button>
  </div>
</section>

<section id="end" class="screen hidden" aria-label="Results">
  <div class="panel end-panel">
    <h2 id="endTitle">You win!</h2>
    <div class="endscore"><span class="es-me"><small>FOXINO</small><b id="endMe">3</b></span><i>:</i><span class="es-him"><small>BLAZE</small><b id="endHim">0</b></span></div>
    <div id="endRecord" class="record"></div>
    <div id="missed" class="missed hidden"><small>Learn these</small><ol id="missedList"></ol></div>
    <button id="againBtn" class="bigbtn" type="button">PLAY AGAIN</button>
    <button id="menuBtn" class="bigbtn alt" type="button">MENU</button>
  </div>
</section>

<div id="loading"><div class="load-box"><div class="load-title">STREETBALL</div><div class="load-bar"><i id="loadFill"></i></div><div class="load-text" id="loadText">Painting the court…</div></div></div>
<noscript>Streetball needs JavaScript.</noscript>
<script type="module" src="game.js?v=2"></script>
</body>
</html>
